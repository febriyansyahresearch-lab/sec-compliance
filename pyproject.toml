[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "sec-compliance"
version = "1.0.0"
description = "GRC Toolkit for Banking - Governance, Risk, and Compliance automation"
authors = [{ name = "Febriyansyah", email = "febriyansyah@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
